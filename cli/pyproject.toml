[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inspirex-cli"
version = "0.1.0"
description = "灵犀 InspireX 标准化 CLI：查询/检索/入库，对接本机 /v1/invoke"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "httpx>=0.24.0",
    "PyYAML>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
inspirex = "inspirex_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["inspirex_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
