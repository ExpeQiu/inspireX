<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>InspireX</title>
    <style>
      body {
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        margin: 12px;
        width: 260px;
        color: #1c1a17;
      }
      button {
        width: 100%;
        margin-top: 8px;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #d5cfc3;
        background: #2f5d50;
        color: #f4faf7;
        cursor: pointer;
      }
      button.ghost {
        background: #ece7dc;
        color: #1c1a17;
      }
      .status {
        margin-top: 8px;
        font-size: 12px;
        color: #6b655c;
      }
    </style>
  </head>
  <body>
    <strong>灵犀采集</strong>
    <p style="font-size: 12px; color: #6b655c">
      右键单张，或对本页图片多选保存。Pinterest 看板可盯梢后自动打开并入库新图。
    </p>
    <button id="pick">本页多选保存</button>
    <button id="watch">盯梢此页</button>
    <p id="watchHint" style="font-size: 12px; color: #6b655c; margin: 6px 0 0">
      Pinterest：登录后盯梢，插件会后台打开看板、滚动取新图。其它站点需保持标签打开。
    </p>
    <button id="health" class="ghost">检测本地服务</button>
    <button id="opts" class="ghost">设置端口 / Token</button>
    <div class="status" id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
